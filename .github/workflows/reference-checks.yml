name: FEngine Python reference checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geo-opt-reference:
    name: GEO-OPT + TASE + HC unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q geo_opt tase fengine_hc tests
      - name: Mandatory QUAL-R1 adversarial integrity pattern gate (all 48 HC variants)
        run: python -m unittest discover -s tests -p 'test_fengine_integrity_pattern_gate.py' -v
      - name: Mandatory QUAL-R1.1 independent per-variant execution and adversarial replay (48 variants)
        run: python -m unittest discover -s tests -p 'test_fengine_qual_r11_per_variant_adversarial.py' -v
      - name: Mandatory QUAL-R1.2 independent mathematical oracles for all 48 HC variants
        run: python -m unittest discover -s tests -p 'test_fengine_qual_r12_independent_math.py' -v
      - name: Mandatory QUAL-R1.2 domain-specific negative scenario for all 48 HC variants
        run: python -m unittest discover -s tests -p 'test_fengine_qual_r12_domain_denials.py' -v
      - name: Verify independent high-precision HC goldens without shared test import order
        run: |
          python -m unittest discover -s tests -p 'test_fengine_hc_reference.py' -v
          python -m unittest discover -s tests -p 'test_fengine_hc_r03_reference.py' -v
          python -m unittest discover -s tests -p 'test_fengine_hc_r06_fcfe.py' -v
      - name: Execute GEO-OPT, TASE and bounded HC reference suites
        run: python -m unittest discover -s tests -v
